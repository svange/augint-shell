## =============================================================================
## ai-shell configuration reference
## =============================================================================
## Every key ai-shell reads, with an example value. Nothing here is active:
## remove the leading "# " from a line to use it. Lines that start with "##"
## are notes.
##
## Where config is read (highest wins, per key):
##   1. CLI flags            ai-shell opencode --model openai.gpt-5.4
##   2. Environment          AI_SHELL_OPENCODE_MODEL=openai.gpt-5.4
##   3. Project file         ./.ai-shell.yaml (or .yml / .toml)
##   4. Global file          ~/.augint/.ai-shell.yaml
##   5. Defaults
## A project file needs only the keys it changes. Every other key comes from
## the global file. To keep a project file out of git without touching
## .gitignore, add ".ai-shell.yaml" to .git/info/exclude.
##
## ai-shell never writes ~/.augint/.ai-shell.yaml. `ai-shell init` refreshes
## this reference at ~/.augint/.ai-shell.example.yaml and writes a copy to
## ./.ai-shell.yaml only when that file does not exist.
## Docs: https://github.com/svange/augint-shell

## --- opencode ----------------------------------------------------------------
## Provider, models, plugins and browser for `ai-shell opencode`.
# opencode:
#   provider: bedrock-mantle       # "ollama" (default), "bedrock-mantle" ("aws"), or an endpoint name
#   aws_partition: govcloud        # "commercial" (us-east-1) or "govcloud" (us-gov-west-1)
#   aws_region: us-gov-west-1      # OpenCode only; aws.bedrock_region is used only in the same partition
#   aws_profile: my-gov-profile    # makes the short-term AWS_BEARER_TOKEN_BEDROCK
#   model: openai.gpt-5.6-terra    # plan + build agents; or openai.gpt-5.4, xai.grok-4.7
#                                  # default: Terra/Luna commercial, openai.gpt-oss-120b GovCloud
#   subagent_model: openai.gpt-5.6-luna   # explore + general subagents
#   claude_compat: false           # true = also read CLAUDE.md and .claude/.agents skills
#   local_chrome: false            # Chrome DevTools MCP (same as --local-chrome)
#   plugins:                       # replaces the defaults; [] = none
#     - "@plannotator/opencode@0.28.67"
#     - "opencode-pty@0.4.0"
#   instructions:                  # replaces the default opencode-shell-strategy; [] = none
#     - "https://raw.githubusercontent.com/JRedeker/opencode-shell-strategy/1303f24df1649202834e052f1d66560ed186e413/shell_strategy.md"
#   remote:                        # `ai-shell opencode remote`: a server on an EC2 box over SSM
#     instance: my-opencode-box    # instance id (i-...) or its Name tag
#     aws_profile: my-gov-profile  # the profile that may use SSM on the box
#     aws_region: us-gov-west-1
#     user: dev                    # the box user that owns the projects
#     projects_dir: ~/projects     # the project is <projects_dir>/<this folder's name>
#     start_command: ai-shell opencode serve   # runs as user in the project; {project} = folder
#   endpoints:                     # self-hosted OpenAI-compatible servers (vLLM, SGLang)
#     vllm:
#       base_url: http://host.docker.internal:8000/v1
#       api_key_env: VLLM_API_KEY
#       models:
#         - Qwen/Qwen3-Coder-30B-A3B-Instruct

## --- claude ------------------------------------------------------------------
## Claude Code backend, account and host Chrome for `ai-shell claude`.
# claude:
#   provider: anthropic            # "anthropic" (direct) or "aws" (Bedrock)
#   account: work                  # default --account; token in .env or a login profile
#   local_chrome: false            # Chrome DevTools MCP (same as --local-chrome)
#   chrome_proxy: ""               # "vpn" (ai-shell's NordVPN container) or a --proxy-server value; claude + opencode Chrome

## --- aws ---------------------------------------------------------------------
# aws:
#   ai_profile: my-infra-account   # AWS_PROFILE in the container
#   bedrock_profile: my-ai-account # profile for Bedrock calls (--aws)
#   region: us-east-1
#   partition: commercial          # or govcloud
#   bedrock_region: us-west-2      # falls back to region
#   bedrock_model: us.meta.llama3-3-70b-instruct-v1:0
#   bedrock_check_cache_ttl: 86400 # seconds to trust a Bedrock check; 0 = every launch

## --- openai ------------------------------------------------------------------
## Picks OPENAI_API_KEY_<PROFILE> (and OPENAI_ORG_ID_<PROFILE>) from .env.
# openai:
#   profile: work

## --- container ---------------------------------------------------------------
# container:
#   image: svange/augint-shell
#   image_tag: latest
#   skip_updates: false            # skip the pre-launch tool update checks
#   image_pull_cache_ttl: 900      # seconds between `docker pull` checks; 0 = every launch
#   extra_env:
#     MY_VAR: value
#   extra_volumes:
#     - /host/path:/container/path
#     - /mnt/models:/models:ro
#   ports:                         # extra container ports to publish
#     - 9000
#     - 9229
#   node_modules_paths:            # extra globs that get a container-local node_modules
#     - apps/*
#   isolate_home_paths:            # back these with a shared volume, not a host bind
#     - .claude                    # (~/.codex is always isolated)

